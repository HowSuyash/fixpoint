[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fixpoint"
version = "0.1.0"
description = "Issue in, failing test, green suite: a test-first bug-fixing agent running NVIDIA Nemotron on Nebius Token Factory."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40",
    "tavily-python>=0.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pytest>=8",
]

[project.scripts]
fixpoint = "fixpoint.cli:main"

[tool.setuptools.packages.find]
include = ["fixpoint*"]

[tool.setuptools.package-data]
fixpoint = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.vercel]
entrypoint = "fixpoint.server:app"
